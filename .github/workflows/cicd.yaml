name: deploy

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          file: Containerfile
          target: pages
          outputs: type=local,dest=site
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: cp -r public/models public/favicon.ico public/robots.txt site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: docker/build-push-action@v6
        with:
          file: Containerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v4
